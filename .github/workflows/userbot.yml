name: "🪐 𝗣𝗿𝗼𝘅𝗶𝗺𝗮 LLEHTABPA"

on:
  schedule:
    - cron: '0 */4 * * *' # Резервный перезапуск каждые 4 часа
  workflow_dispatch:

concurrency:
  group: proxima-userbot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Убрали строчку cache: 'pip', теперь ошибки не будет!
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Ставим только легкий Telethon за пару секунд для моментального старта
      - name: Fast Install Core
        run: |
          python -m pip install --upgrade pip
          pip install telethon

      - name: Run 🪐 𝗣𝗿𝗼𝘅𝗶𝗺𝗮 LLEHTABPA with Background Heavy Install
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. СКАЧИВАНИЕ И УСТАНОВКА ТЯЖЕЛЫХ ШТУК В ФОНЕ (не задерживает старт бота)
          (
            echo "⚡ [ФОН] Скачиваю статический бинарник FFmpeg..."
            wget -q https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
            sudo mv ffmpeg-master-latest-linux64-gpl/bin/* /usr/local/bin/
            rm -rf ffmpeg-master-*
            echo "🎬 [ФОН] FFmpeg готов к работе!"

            echo "📦 [ФОН] Устанавливаю OpenCV, Pillow, Lottie и др..."
            pip install rlottie-python pillow opencv-python-headless numpy requests pilmoji
            echo "🎉 [ФОН] Все тяжелые библиотеки готовы, модули могут их юзать!"
          ) &

          # 2. МОМЕНТАЛЬНЫЙ ЗАПУСК БОТА (он онлайн уже через 5 секунд)
          timeout 20400s python app.py || true

          # 3. АВТОПЕРЕЗАПУСК ЧЕРЕЗ 5 ЧАСОВ 40 МИНУТ
          echo "⏳ Время смены караула. Перезапускаем воркфлоу..."
          gh workflow run "🪐 𝗣𝗿𝗼𝘅𝗶𝗺𝗮 LLEHTABPA" --ref main
