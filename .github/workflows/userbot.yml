name: "🪐 𝗣𝗿𝗼𝘅𝗶𝗺𝗮 LLEHTABPA"

on:
  schedule:
    - cron: '0 */4 * * *' # Резервный перезапуск каждые 4 часа
  workflow_dispatch:

concurrency:
  group: proxima-userbot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # КЭШ В ДОМАШНЕЙ ПАПКЕ (без проблем с root-правами)
      - name: Cache FFmpeg Binary
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/ffmpeg
          key: ${{ runner.os }}-ffmpeg-home-v1

      # Быстрый старт ядра
      - name: Fast Install Core
        run: |
          python -m pip install --upgrade pip
          pip install telethon

      - name: Run 🪐 𝗣𝗿𝗼𝘅𝗶𝗺𝗮 LLEHTABPA with Background Heavy Install
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (
            mkdir -p ~/.local/bin

            # Проверяем наличие бинарника в ~/.local/bin
            if [ ! -f ~/.local/bin/ffmpeg ]; then
              echo "⚡ [ФОН] Скачиваю FFmpeg (сохранится в кэш)..."
              wget -q https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
              tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
              mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ~/.local/bin/
              chmod +x ~/.local/bin/ffmpeg
              rm -rf ffmpeg-master-*
              echo "🎬 [ФОН] FFmpeg готов и ждет финальной записи в кэш!"
            else
              echo "🎬 [ФОН] FFmpeg мгновенно взят из кэша!"
            fi

            echo "📦 [ФОН] Устанавливаю OpenCV, Pillow, Lottie, Gradio и др..."
            pip install rlottie-python pillow opencv-python-headless numpy requests pilmoji gradio_client
            echo "🎉 [ФОН] Все тяжелые библиотеки готовы!"
          ) &

          # Запуск бота
          timeout 20400s python app.py || true

          echo "⏳ Время смены караула. Перезапускаем воркфлоу..."
          gh workflow run "🪐 𝗣𝗿𝗼𝘅𝗶𝗺𝗮 LLEHTABPA" --ref main
