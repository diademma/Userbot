name: "🪐 𝗣𝗿𝗼𝘅𝗶𝗺𝗮 LLEHTABPA"

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: proxima-userbot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure System PATH
        run: |
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache FFmpeg Binary
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/ffmpeg
          key: ${{ runner.os }}-ffmpeg-home-v1

      # Моментальный старт за 3 секунды
      - name: Fast Install Core
        run: |
          python -m pip install --upgrade pip
          pip install telethon

      - name: Run 🪐 𝗣𝗿𝗼𝘅𝗶𝗺𝗮 LLEHTABPA with Background Heavy Install
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (
            mkdir -p ~/.local/bin

            if [ ! -f ~/.local/bin/ffmpeg ]; then
              echo "⚡ [ФОН] Скачиваю FFmpeg..."
              wget -q https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
              tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
              mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ~/.local/bin/
              chmod +x ~/.local/bin/ffmpeg
              rm -rf ffmpeg-master-*
              echo "🎬 [ФОН] FFmpeg готов!"
            else
              echo "🎬 [ФОН] FFmpeg взят из кэша!"
            fi

            echo "📦 [ФОН] Устанавливаю библиотеки..."
            pip install opencv-python-headless numpy pillow pilmoji yt-dlp aiohttp mutagen onnxruntime requests
            echo "🎉 [ФОН] Все библиотеки готовы!"
          ) &

          timeout 20400s python app.py || true

          echo "⏳ Время смены караула. Перезапускаем воркфлоу..."
          gh workflow run "🪐 𝗣𝗿𝗼𝘅𝗶𝗺𝗮 LLEHTABPA" --ref main
