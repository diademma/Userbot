name: LEX Sniper Userbot

on:
  schedule:
    - cron: '0 */4 * * *' # Резервный запуск каждые 4 часа
  workflow_dispatch:

concurrency:
  group: telegram-userbot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # Дает право воркфлоу перезапускать самого себя

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install System Packages (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon rlottie-python

      - name: Run Userbot with Auto-Relay
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Запуск бота с ограничением по времени 5 часов 40 минут (20400 сек)
          # Это защищает от принудительного убийства гитхабом на 6 часах
          timeout 20400s python app.py || true

          echo "⏳ Время смены караула (5ч 40м вышло). Запускаем следующий цикл..."
          gh workflow run "LEX Sniper Userbot" --ref main
